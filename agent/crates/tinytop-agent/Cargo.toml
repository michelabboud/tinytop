[package]
name = "tinytop-agent"
version = "0.8.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["linux-collector"]
linux-collector = ["tinytop-collectors/linux-collector"]
macos-collector = ["tinytop-collectors/macos-collector"]
windows-collector = ["tinytop-collectors/windows-collector"]

[dependencies]
axum.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
serde.workspace = true
serde_json.workspace = true
tinytop-collectors = { path = "../tinytop-collectors", default-features = false }
tinytop-store = { path = "../tinytop-store" }
tokio.workspace = true

[dev-dependencies]
http-body-util = "=0.1.3"
opentelemetry-proto.workspace = true
prost.workspace = true
tower = { version = "=0.5.3", features = ["util"] }
